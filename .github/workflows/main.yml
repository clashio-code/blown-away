          static void *g_host_h[8]; static int g_nhost;
          static void preload_host(void) {
            static const char *const names[] = { "libm.so.6", "libz.so.1", "libgcc_s.so.1", "libstdc++.so.6", "libGLESv2.so.2", "libEGL.so.1", NULL };
