            rs = strrchr(m->sig, ')'); if (!rs) return 0; rs++;
            if (rs[0] == 'Z' && !strcmp(m->name, "equals")) {
              u32 eq = (thiz && arg0 && thiz->str && arg0->str) ? (strcmp(thiz->str, arg0->str) == 0) : (thiz == arg0);
              if (m->ncalls <= 3) LOG("[JNI]   equals(\"%s\", \"%s\") = %u\n", thiz && thiz->str ? thiz->str : "?", arg0 && arg0->str ? arg0->str : "?", eq);
              return eq;
            }
            if (rs[0] == 'I') { if (!strcmp(m->name, "getSplashMode")) return 2; /* settings.xml: splash_mode=2 */ if (!strcmp(m->name, "getWidth")) return (u32)g_screen_w; if (!strcmp(m->name, "getHeight")) return (u32)g_screen_h; }
            if (rs[0] == 'L') {
              char cn[120]; size_t n = strlen(rs) - 2; JObj *o;
              if (!strcmp(rs, "Ljava/lang/String;")) return U32(str_new(special_string(m->name, thiz)));
              if (n >= sizeof cn) n = sizeof cn - 1;
              memcpy(cn, rs + 1, n); cn[n] = 0;
              o = obj_new(cls_get(cn));
              if (is_file_getter(m->name)) o->str = strdup(g_datadir);
              return U32(o);
            }
            if (rs[0] == '[') return 0;
            return 0;
          }
