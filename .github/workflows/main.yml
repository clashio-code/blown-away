            for (i = 0; i < L->nph; i++) if (L->ph[i].p_type == PT_LOAD) {
              u32 a = L->ph[i].p_vaddr & ~0xfffu, b = (L->ph[i].p_vaddr + L->ph[i].p_memsz + 0xfffu) & ~0xfffu;
              if (a < lo) lo = a;
              if (b > hi) hi = b;
            }
            fl = MAP_PRIVATE | MAP_ANONYMOUS;
          #if !defined(__arm__) && defined(MAP_32BIT)
            fl |= MAP_32BIT;
          #endif
            region = mmap(NULL, hi - lo, PROT_READ | PROT_WRITE | PROT_EXEC, fl, -1, 0);
            if (region == MAP_FAILED) { LOG("mmap %u byte gagal: %s\n", hi - lo, strerror(errno)); close(fd); return NULL; }
            L->base = region - lo; L->span = hi;
            for (i = 0; i < L->nph; i++) {
              const Elf32_Phdr *p = &L->ph[i];
              if (p->p_type == PT_LOAD) {
                if (p->p_filesz && pread(fd, L->base + p->p_vaddr, p->p_filesz, p->p_offset) != (ssize_t)p->p_filesz) { LOG("baca segmen gagal\n"); close(fd); return NULL; }
                if ((p->p_flags & PF_W) && !L->rw_start) L->rw_start = (U32(L->base) + p->p_vaddr) & ~0xfffu;
              } else if (p->p_type == PT_ARM_EXIDX) { L->exidx = U32(L->base) + p->p_vaddr; L->exidx_n = p->p_memsz / 8; }
              else if (p->p_type == PT_DYNAMIC) dyn = (const Elf32_Dyn *)(L->base + p->p_vaddr);
            }
            close(fd);
            LOG("[load] %s base=%p span=0x%x exidx=%u entri\n", name, (void *)L->base, L->span, L->exidx_n);
            if (!dyn) { LOG("tidak ada PT_DYNAMIC\n"); return NULL; }
            for (; dyn->d_tag != DT_NULL; dyn++) {
              u32 v = dyn->d_un.d_val;
              switch (dyn->d_tag) {
                case DT_NEEDED: if (nneed < 32) needed[nneed++] = v; break;
                case DT_HASH: hashv = v; break;
                case 0x6ffffef5: gnuhash = v; break;
                case DT_STRTAB: L->strtab = (const char *)(L->base + v); break;
                case DT_SYMTAB: L->symtab = (const Elf32_Sym *)(L->base + v); break;
                case DT_REL: rel = (const Elf32_Rel *)(L->base + v); break;
                case DT_RELSZ: relsz = v; break;
                case DT_JMPREL: jmp = (const Elf32_Rel *)(L->base + v); break;
                case DT_PLTRELSZ: jmpsz = v; break;
                case DT_INIT: L->init = v; break;
                case DT_INIT_ARRAY: L->init_array = v; break;
                case DT_INIT_ARRAYSZ: L->init_arraysz = v; break;
                case DT_SYMBOLIC: L->symbolic = 1; break;
                case DT_FLAGS: if (v & DF_SYMBOLIC) L->symbolic = 1; break;
                default: break;
              }
            }
            if (!L->symtab || !L->strtab) { LOG("simbol/strtab tidak ada\n"); return NULL; }
            if (hashv) L->nsym = ((const u32 *)(L->base + hashv))[1];
            else if (gnuhash) L->nsym = gnu_nsym((const u32 *)(L->base + gnuhash));
            else { LOG("tidak ada DT_HASH/DT_GNU_HASH\n"); return NULL; }
            L->rcache = calloc(L->nsym + 1, sizeof(u32)); L->rdone = calloc(L->nsym + 1, 1);
            build_htab(L);
            g_loading[g_nloading++] = L->name;
            for (i = 0; i < (int)nneed; i++) {
              const char *dep = L->strtab + needed[i];
              if (strcmp(dep, name) && file_exists(dep)) { if (!load_lib(dep)) LOG("  peringatan: dependensi %s gagal\n", dep); }
            }
            g_nloading--;
            if (g_nlibs < MAXLIBS) g_libs[g_nlibs++] = L;
            LOG("[reloc] %s: %u simbol dinamis, rel=%u plt=%u, symbolic=%d\n", name, L->nsym, relsz / 8, jmpsz / 8, L->symbolic);
            if (rel) apply_rels(L, rel, relsz / 8, "REL");
            if (jmp) apply_rels(L, jmp, jmpsz / 8, "PLT");
          #ifdef __GNUC__
            __builtin___clear_cache((char *)L->base + lo, (char *)L->base + hi);
          #endif
            LOG("[reloc] %s selesai: self=%d lib=%d shim=%d host=%d TAK-KETEMU=%d reloc-bad=%d\n", name, L->n_self, L->n_lib, L->n_shim, L->n_host, L->n_unres, L->n_bad);
            if (g_run_init) run_ctors(L);
            return L;
          }

