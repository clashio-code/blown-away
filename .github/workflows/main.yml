          static void dump_frame(int n) {
            void (*readpx)(int, int, int, int, unsigned, unsigned, void *);
            int w = g_screen_w, h = g_screen_h, i; uint8_t *buf; char fn[64]; FILE *f; uint8_t hd[54]; u32 sz;
            *(void **)&readpx = sdl.GL_GetProcAddress("glReadPixels");
            if (!readpx) return;
            buf = malloc((size_t)w * h * 4);
            if (!buf) return;
            readpx(0, 0, w, h, 0x1908 /*GL_RGBA*/, 0x1401 /*GL_UNSIGNED_BYTE*/, buf);
            for (i = 0; i < w * h; i++) { uint8_t t = buf[i * 4]; buf[i * 4] = buf[i * 4 + 2]; buf[i * 4 + 2] = t; buf[i * 4 + 3] = 255; }
            snprintf(fn, sizeof fn, "m4_frame_%d.bmp", n);
            f = fopen(fn, "wb");
            if (f) {
              sz = 54 + (u32)w * h * 4; memset(hd, 0, 54);
              hd[0] = 'B'; hd[1] = 'M'; memcpy(hd + 2, &sz, 4); hd[10] = 54; hd[14] = 40;
              memcpy(hd + 18, &w, 4); memcpy(hd + 22, &h, 4); hd[26] = 1; hd[28] = 32;
              fwrite(hd, 1, 54, f); fwrite(buf, 1, (size_t)w * h * 4, f); fclose(f);
              LOG("[GFX] frame %d disimpan ke %s (%dx%d)\n", n, fn, w, h);
            }
            free(buf);
          }
