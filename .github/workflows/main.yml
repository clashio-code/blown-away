          /* ---- SHA1Init/Update/Final (disediakan libc bionic; layout opak, muat dalam 96 byte) ---- */
          typedef struct { u32 st[5]; u32 pad; uint64_t cnt; uint8_t buf[64]; } Sha1Ctx;
          static u32 rol32(u32 v, int n) { return (v << n) | (v >> (32 - n)); }
          static void sha1_block(u32 st[5], const uint8_t *b) {
            u32 w[80], a, bb, c, d, e, t; int i;
            for (i = 0; i < 16; i++) w[i] = ((u32)b[i * 4] << 24) | ((u32)b[i * 4 + 1] << 16) | ((u32)b[i * 4 + 2] << 8) | b[i * 4 + 3];
            for (i = 16; i < 80; i++) w[i] = rol32(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
            a = st[0]; bb = st[1]; c = st[2]; d = st[3]; e = st[4];
            for (i = 0; i < 80; i++) {
              u32 f, k;
              if (i < 20) { f = (bb & c) | (~bb & d); k = 0x5A827999u; }
              else if (i < 40) { f = bb ^ c ^ d; k = 0x6ED9EBA1u; }
              else if (i < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDCu; }
              else { f = bb ^ c ^ d; k = 0xCA62C1D6u; }
              t = rol32(a, 5) + f + e + k + w[i]; e = d; d = c; c = rol32(bb, 30); bb = a; a = t;
            }
            st[0] += a; st[1] += bb; st[2] += c; st[3] += d; st[4] += e;
          }
          static void shim_SHA1Init(Sha1Ctx *c) {
            c->st[0] = 0x67452301u; c->st[1] = 0xEFCDAB89u; c->st[2] = 0x98BADCFEu; c->st[3] = 0x10325476u; c->st[4] = 0xC3D2E1F0u; c->cnt = 0;
          }
          static void shim_SHA1Update(Sha1Ctx *c, const uint8_t *d, size_t len) {
            size_t i; u32 j = (u32)(c->cnt & 63);
            c->cnt += len;
            for (i = 0; i < len; i++) { c->buf[j++] = d[i]; if (j == 64) { sha1_block(c->st, c->buf); j = 0; } }
          }
          static void shim_SHA1Final(uint8_t *dig, Sha1Ctx *c) {
            uint64_t bits = c->cnt * 8; uint8_t pad = 0x80, z = 0, lb[8]; int i;
            shim_SHA1Update(c, &pad, 1);
            while ((c->cnt & 63) != 56) shim_SHA1Update(c, &z, 1);
            for (i = 0; i < 8; i++) lb[i] = (uint8_t)(bits >> (56 - 8 * i));
            shim_SHA1Update(c, lb, 8);
            for (i = 0; i < 20; i++) dig[i] = (uint8_t)(c->st[i / 4] >> (24 - 8 * (i % 4)));
          }

