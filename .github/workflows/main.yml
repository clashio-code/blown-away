          static u32 fnv(const char *s) { u32 h = 2166136261u; for (; *s; s++) { h ^= (uint8_t)*s; h *= 16777619u; } return h | 1u; }
          static void build_htab(Lib *L) {
            u32 i, sz = 16, k, h;
            while (sz < L->nsym * 4) sz <<= 1;
            L->htab = calloc(sz, sizeof(u32)); L->hsize = sz;
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->symtab[i];
              if (s->st_shndx == SHN_UNDEF || !s->st_name) continue;
              if (ELF32_ST_BIND(s->st_info) == STB_LOCAL) continue;
              h = fnv(L->strtab + s->st_name);
              for (k = h & (sz - 1); L->htab[k]; k = (k + 1) & (sz - 1)) ;
              L->htab[k] = i;
            }
          }
          static u32 lib_lookup(Lib *L, const char *name) {
            u32 h, k;
            if (!L->htab) return 0;
            h = fnv(name);
            for (k = h & (L->hsize - 1); L->htab[k]; k = (k + 1) & (L->hsize - 1)) {
              const Elf32_Sym *s = &L->symtab[L->htab[k]];
              if (!strcmp(L->strtab + s->st_name, name)) return U32(L->base) + s->st_value;
            }
            return 0;
          }
          static u32 resolve_global(const char *name) {
            int i; u32 a; void *p;
            for (i = 0; i < g_nlibs; i++) if ((a = lib_lookup(g_libs[i], name))) return a;
            for (i = 0; g_shims[i].n; i++) if (!strcmp(g_shims[i].n, name)) return U32(g_shims[i].a);
            p = host_lookup(name);
            return p ? U32(p) : 0;
          }
          static const char *g_unres[1024]; static int g_nunres;

          static u32 resolve_sym(Lib *L, const char *name, int weak) {
            u32 a; int i; void *p;
            if (L->symbolic && (a = lib_lookup(L, name))) { L->n_self++; return a; }
            for (i = 0; i < g_nlibs; i++) {
              if (g_libs[i] == L && L->symbolic) continue;
              if ((a = lib_lookup(g_libs[i], name))) { if (g_libs[i] == L) L->n_self++; else L->n_lib++; return a; }
            }
            if (!strcmp(name, "__data_start") || !strcmp(name, "data_start")) {
              Lib *m = find_lib("libmono.so");
              if (m && m->rw_start) { L->n_shim++; return m->rw_start; }
            }
            for (i = 0; g_shims[i].n; i++) if (!strcmp(g_shims[i].n, name)) { L->n_shim++; return U32(g_shims[i].a); }
            p = host_lookup(name);
            if (p) { L->n_host++; return U32(p); }
            if (weak) { LOG("  [weak-kosong] %s: %s\n", L->name, name); return 0; }
            L->n_unres++;
            LOG("  [TAK-KETEMU] %s: %s\n", L->name, name);
            { int k, dup = 0; for (k = 0; k < g_nunres; k++) if (!strcmp(g_unres[k], name)) dup = 1; if (!dup && g_nunres < 1024) g_unres[g_nunres++] = strdup(name); }
            p = thunk_for(name);
            return U32(p);
          }

          static u32 sym_addr(Lib *L, u32 si) {
            const Elf32_Sym *s; const char *nm;
            if (si == 0) return 0;
            if (si >= L->nsym) return 0;
            if (L->rdone[si]) return L->rcache[si];
            s = &L->symtab[si]; nm = L->strtab + s->st_name;
            L->rcache[si] = resolve_sym(L, nm, ELF32_ST_BIND(s->st_info) == STB_WEAK);
            L->rdone[si] = 1;
            return L->rcache[si];
          }

          static u32 gnu_nsym(const u32 *h) {
            u32 nb = h[0], symoff = h[1], bloom = h[2], i, max = 0;
            const u32 *buckets = h + 4 + bloom, *chain = buckets + nb;
            for (i = 0; i < nb; i++) if (buckets[i] > max) max = buckets[i];
            if (max < symoff) return symoff;
            while (!(chain[max - symoff] & 1)) max++;
            return max + 1;
          }

          static void apply_rels(Lib *L, const Elf32_Rel *rel, u32 n, const char *what) {
            u32 i, shown = 0;
            for (i = 0; i < n; i++) {
              u32 *where = (u32 *)PTR(U32(L->base) + rel[i].r_offset);
              u32 type = ELF32_R_TYPE(rel[i].r_info), si = ELF32_R_SYM(rel[i].r_info), S;
              switch (type) {
                case R_ARM_NONE: break;
                case R_ARM_RELATIVE: *where += U32(L->base); break;
                case R_ARM_GLOB_DAT: case R_ARM_JUMP_SLOT: *where = sym_addr(L, si); break;
                case R_ARM_ABS32: S = sym_addr(L, si); *where += S; break;
                case R_ARM_REL32: S = sym_addr(L, si); *where += S - U32(where); break;
                default:
                  L->n_bad++;
                  if (shown++ < 5) LOG("  [reloc-tidak-didukung] %s %s tipe=%u offset=0x%x\n", L->name, what, type, rel[i].r_offset);
              }
            }
          }

          static void run_ctors(Lib *L) {
            u32 i, n = L->init_arraysz / 4;
            if (L->init) { LOG("[init] %s DT_INIT +0x%x\n", L->name, L->init); ((void (*)(void))PTR(U32(L->base) + L->init))(); }
            for (i = 0; i < n; i++) {
              u32 f = ((u32 *)PTR(U32(L->base) + L->init_array))[i];
              if (f == 0 || f == 0xffffffffu) continue;
              LOG("[ctor] %s #%u/%u -> +0x%x\n", L->name, i + 1, n, f - U32(L->base));
              ((void (*)(void))PTR(f))();
            }
            LOG("[init] %s selesai\n", L->name);
          }

          static Lib *load_lib(const char *name) {
            Lib *L; char path[512]; int fd, i, fl; Elf32_Ehdr eh; u32 lo = 0xffffffffu, hi = 0, needed[32], nneed = 0, hashv = 0, gnuhash = 0;
            const Elf32_Dyn *dyn = NULL; const Elf32_Rel *rel = NULL, *jmp = NULL; u32 relsz = 0, jmpsz = 0; uint8_t *region;
            if ((L = find_lib(name))) return L;
            for (i = 0; i < g_nloading; i++) if (!strcmp(g_loading[i], name)) return NULL;
            snprintf(path, sizeof path, "%s/%s", g_libdir, name);
            fd = open(path, O_RDONLY);
            if (fd < 0) { LOG("GAGAL buka %s: %s\n", path, strerror(errno)); return NULL; }
            if (pread(fd, &eh, sizeof eh, 0) != (ssize_t)sizeof eh || memcmp(eh.e_ident, ELFMAG, 4) || eh.e_ident[EI_CLASS] != ELFCLASS32 || eh.e_machine != EM_ARM) {
