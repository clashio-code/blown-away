name: Build Blown Away M4e (JNI wake-lock diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM hard-float toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Extract loader source and apply diagnostic fix
        shell: python
        run: |
          from pathlib import Path
          import re, textwrap

          workflow = Path('.github/workflows/build-blownaway-m4d.yml')
          if not workflow.exists():
              raise SystemExit('Missing .github/workflows/build-blownaway-m4d.yml (the uploaded Blown Away workflow must be committed to this repository first).')
          text = workflow.read_text(encoding='utf-8')
          match = re.search(r"cat > src/m4loader\.c <<'EOF_C'\s*\n(.*?)\n\s*EOF_C", text, re.S)
          if not match:
              raise SystemExit('Could not find the m4loader.c heredoc in build-blownaway-m4d.yml')
          source = textwrap.dedent(match.group(1)) + '\n'

          old = 'if (rs[0] == \'I\') { if (!strcmp(m->name, "getSplashMode")) return 2;'
          new = 'if (rs[0] == \'I\') { if (!strcmp(m->name, "isHeld")) return 1; if (!strcmp(m->name, "checkCallingOrSelfPermission")) return 0; if (!strcmp(m->name, "getSplashMode")) return 2;'
          if old not in source:
              raise SystemExit('Expected call_core() pattern was not found; refusing to build an unpatched binary.')
          source = source.replace(old, new, 1)
          Path('src').mkdir(exist_ok=True)
          Path('out/blownaway').mkdir(parents=True, exist_ok=True)
          Path('src/m4loader.c').write_text(source, encoding='utf-8')
          print('Applied diagnostic behavior: WakeLock.isHeld() returns true; permission check returns granted.')

      - name: Compile ARMhf loader
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-unused-parameter -Wno-cast-function-type \
            -fno-strict-aliasing -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 \
            -o out/blownaway/m4loader src/m4loader.c -Wl,--no-as-needed -ldl -lpthread
          arm-linux-gnueabihf-strip out/blownaway/m4loader
          file out/blownaway/m4loader
          arm-linux-gnueabihf-readelf -h out/blownaway/m4loader | grep -E 'Class|Machine|Flags'
          arm-linux-gnueabihf-readelf -V out/blownaway/m4loader | grep -o 'GLIBC_[0-9.]*' | sort -uV | tee /tmp/glibc_vers.txt
          MAXV=$(tail -n1 /tmp/glibc_vers.txt)
          echo "Highest required glibc: ${MAXV:-none}"
          if [ -n "$MAXV" ] && [ "$(printf '%s\n' "$MAXV" GLIBC_2.37 | sort -V | tail -n1)" != "GLIBC_2.37" ]; then
            echo "::error::Binary requires $MAXV; target device has glibc 2.37"
            exit 1
          fi

      - name: Package diagnostic launcher
        run: |
          cat > out/BlownAwayM4e.sh <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          GAMEDIR="$HERE/blownaway"
          [ -d "$GAMEDIR" ] || GAMEDIR="/${directory:-roms}/ports/blownaway"
          cd "$GAMEDIR" || exit 1
          export LD_LIBRARY_PATH="/usr/lib32:/lib32:/usr/lib/arm-linux-gnueabihf:$LD_LIBRARY_PATH"
          chmod +x ./m4loader
          mkdir -p files
          rm -f m4_frame_*.bmp
          APK="$(ls ./*.apk 2>/dev/null | head -n1)"
          echo "M4e diagnostic run $(date)" > m4_stdout.txt
          echo "GAMEDIR=$GAMEDIR APK=${APK:-MISSING}" >> m4_stdout.txt
          timeout 170 ./m4loader --stage 4 --libdir libs --apk "$APK" --datadir files --log m4_log.txt --maxsec 90 --dump 30,150,600 >> m4_stdout.txt 2>&1
          echo "loader exit code: $?" >> m4_stdout.txt
          ls -l m4_frame_*.bmp >> m4_stdout.txt 2>&1
          sync
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF
          chmod +x out/BlownAwayM4e.sh
          cat > out/README-M4e.txt <<'EOF'
          Experimental diagnostic build for Blown Away.
          Install m4loader and BlownAwayM4e.sh into the existing port folder, preserving its blownaway/ subfolder and game assets.
          This diagnostic changes the fake Android results for WakeLock.isHeld() and permission checks only.
          It is not a confirmed crash fix. Keep the previous build so you can roll back.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blownaway-m4e-armhf
          path: out/
