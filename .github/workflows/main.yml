            g_jni_tab[21] = (void *)jni_NewRef; g_jni_tab[22] = (void *)jni_DelRef; g_jni_tab[23] = (void *)jni_DelRef; g_jni_tab[24] = (void *)jni_IsSameObject;
            g_jni_tab[25] = (void *)jni_NewRef; g_jni_tab[26] = (void *)jni_EnsureLocalCapacity; g_jni_tab[27] = (void *)jni_AllocObject;
            set3(28, (void *)jni_NewObject);
            g_jni_tab[31] = (void *)jni_GetObjectClass; g_jni_tab[32] = (void *)jni_IsInstanceOf; g_jni_tab[33] = (void *)jni_GetMethodID;
            for (i = 0; i < 10; i++) {
              if (i < 6) { /* Object..Int: bentuk variadic, va_list, jvalue* ditangani terpisah (butuh argumen pertama untuk String.equals) */
                int b0 = 34 + i * 3, b1 = 114 + i * 3;
                g_jni_tab[b0] = (void *)jni_CallI; g_jni_tab[b0 + 1] = (void *)jni_CallI_V; g_jni_tab[b0 + 2] = (void *)jni_CallI_A;
                g_jni_tab[b1] = (void *)jni_CallI; g_jni_tab[b1 + 1] = (void *)jni_CallI_V; g_jni_tab[b1 + 2] = (void *)jni_CallI_A;
              } else { set3(34 + i * 3, callfn[i]); set3(114 + i * 3, callfn[i]); }
            }
            g_jni_tab[94] = (void *)jni_GetFieldID; g_jni_tab[95] = (void *)jni_GetObjectField;
            for (i = 96; i <= 100; i++) g_jni_tab[i] = (void *)jni_GetIntField;
            g_jni_tab[101] = (void *)jni_GetLongField; g_jni_tab[102] = (void *)jni_GetFloatField; g_jni_tab[103] = (void *)jni_GetDoubleField;
            for (i = 104; i <= 112; i++) g_jni_tab[i] = (void *)jni_SetField;
            g_jni_tab[113] = (void *)jni_GetStaticMethodID; g_jni_tab[144] = (void *)jni_GetStaticFieldID; g_jni_tab[145] = (void *)jni_GetStaticObjectField;
            for (i = 146; i <= 150; i++) g_jni_tab[i] = (void *)jni_GetStaticIntField;
            g_jni_tab[151] = (void *)jni_GetLongField; g_jni_tab[152] = (void *)jni_GetFloatField; g_jni_tab[153] = (void *)jni_GetDoubleField;
            for (i = 154; i <= 162; i++) g_jni_tab[i] = (void *)jni_SetField;
            g_jni_tab[163] = (void *)jni_NewString; g_jni_tab[164] = (void *)jni_GetStringLength; g_jni_tab[165] = (void *)jni_GetStringChars;
            g_jni_tab[166] = (void *)jni_ReleaseStringChars; g_jni_tab[167] = (void *)jni_NewStringUTF; g_jni_tab[168] = (void *)jni_GetStringUTFLength;
            g_jni_tab[169] = (void *)jni_GetStringUTFChars; g_jni_tab[170] = (void *)jni_ReleaseStringUTFChars; g_jni_tab[171] = (void *)jni_GetArrayLength;
            g_jni_tab[172] = (void *)jni_NewObjectArray; g_jni_tab[173] = (void *)jni_GetObjectArrayElement; g_jni_tab[174] = (void *)jni_SetObjectArrayElement;
            g_jni_tab[175] = (void *)jni_NewBooleanArray; g_jni_tab[176] = (void *)jni_NewByteArray; g_jni_tab[177] = (void *)jni_NewCharArray;
            g_jni_tab[178] = (void *)jni_NewShortArray; g_jni_tab[179] = (void *)jni_NewIntArray; g_jni_tab[180] = (void *)jni_NewLongArray;
            g_jni_tab[181] = (void *)jni_NewFloatArray; g_jni_tab[182] = (void *)jni_NewDoubleArray;
            for (i = 0; i < 8; i++) {
              g_jni_tab[183 + i] = (void *)jni_GetArrayElements; g_jni_tab[191 + i] = (void *)jni_ReleaseArrayElements;
              g_jni_tab[199 + i] = (void *)jni_GetArrayRegion; g_jni_tab[207 + i] = (void *)jni_SetArrayRegion;
            }
            g_jni_tab[215] = (void *)jni_RegisterNatives; g_jni_tab[216] = (void *)jni_ret_zero; g_jni_tab[217] = (void *)jni_ret_zero;
            g_jni_tab[218] = (void *)jni_ret_zero; g_jni_tab[219] = (void *)jni_GetJavaVM; g_jni_tab[222] = (void *)jni_GetCritical;
            g_jni_tab[223] = (void *)jni_ReleaseArrayElements; g_jni_tab[224] = (void *)jni_GetStringCritical; g_jni_tab[225] = (void *)jni_ReleaseStringChars;
            g_jni_tab[226] = (void *)jni_NewRef; g_jni_tab[227] = (void *)jni_DelRef; g_jni_tab[228] = (void *)jni_ret_zero;
            g_jni_tab[229] = (void *)jni_NewDirectByteBuffer; g_jni_tab[230] = (void *)jni_GetDirectBufferAddress;
            g_jni_tab[231] = (void *)jni_GetDirectBufferCapacity; g_jni_tab[232] = (void *)jni_GetObjectRefType;
            for (i = 0; i < 240; i++) if (!g_jni_tab[i] && i >= 4) { char nm[32]; snprintf(nm, sizeof nm, "JNIEnv#%d", i); g_jni_tab[i] = thunk_for(nm); }
            g_vm_tab[3] = (void *)vm_ret0; g_vm_tab[4] = (void *)vm_attach; g_vm_tab[5] = (void *)vm_ret0; g_vm_tab[6] = (void *)vm_getenv; g_vm_tab[7] = (void *)vm_attach;
          }

          static Native *find_native(const char *cls_sub, const char *name) {
            int i;
            for (i = 0; i < g_nnatives; i++) if (strstr(g_natives[i].cls, cls_sub) && !strcmp(g_natives[i].name, name)) return &g_natives[i];
            return NULL;
          }
          static int has_natives_of(const char *cls_sub) {
            int i;
            for (i = 0; i < g_nnatives; i++) if (strstr(g_natives[i].cls, cls_sub)) return 1;
            return 0;
          }
          static void call_jni_onload(Lib *L) {
            u32 a = lib_lookup(L, "JNI_OnLoad"); int r;
            if (!a) { LOG("%s tidak punya JNI_OnLoad\n", L->name); return; }
            LOG("== JNI_OnLoad(%s) +0x%x ...\n", L->name, a - U32(L->base));
            r = ((int (*)(void *, void *))PTR(a))(&g_vm_head, NULL);
            LOG("== JNI_OnLoad(%s) selesai, versi=0x%x\n", L->name, r);
          }

          /* ------------------------------------------------------------------ ringkasan */
          static void summary(void) {
            int i;
            LOG("\n=============== RINGKASAN ===============\n");
            for (i = 0; i < g_nlibs; i++) {
              Lib *L = g_libs[i];
              LOG("%-12s base=%p self=%d lib=%d shim=%d host=%d TAK-KETEMU=%d reloc-bad=%d\n", L->name, (void *)L->base, L->n_self, L->n_lib, L->n_shim, L->n_host, L->n_unres, L->n_bad);
            }
            LOG("Simbol yang TAK ketemu (di-stub, dicatat saat dipanggil): %d\n", g_nunres);
            for (i = 0; i < g_nunres; i++) LOG("   %s\n", g_unres[i]);
            LOG("Native terdaftar via RegisterNatives: %d\n", g_nnatives);
            LOG("Kelas JNI diminta: %d, method: %d, field: %d\n", g_ncls, g_nmeths, g_nfields);
            LOG("=========================================\n");
          }


          static pthread_t g_main_thread;
          static void *wd_thread(void *a) {
            int last = -1, stuck = 0; (void)a;
            for (;;) {
              sleep(8);
              LOG("[wd] frame=%d\n", g_frames);
              if (g_frames == last) { if (++stuck >= 2) { LOG("[wd] tidak ada frame baru, minta thread utama menunjukkan posisinya\n"); pthread_kill(g_main_thread, SIGURG); } }
              else stuck = 0;
              last = g_frames;
            }
            return NULL;
          }
          static int parse_i(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }
          static void parse_dump(const char *s) {
            int v = 0, have = 0;
            for (;; s++) {
              if (*s >= '0' && *s <= '9') { v = v * 10 + (*s - '0'); have = 1; }
              else { if (have && g_ndump < 16) g_dump[g_ndump++] = v; v = 0; have = 0; if (!*s) break; }
            }
          }
          typedef int (*NatI0)(void *, void *);
          typedef void (*NatV0)(void *, void *);
          typedef void (*NatVI)(void *, void *, int);
          typedef void (*NatVP)(void *, void *, void *);
          typedef void (*NatV4)(void *, void *, int, int, int, int);

          static int run_gfx(JObj *player) {
            Native *n_aa = find_native("UnityPlayer", "nativeRequestedAA"), *n_32 = find_native("UnityPlayer", "nativeRequested32bitDisplayBuffer");
            Native *n_or = find_native("UnityPlayer", "nativeDeviceOrientation"), *n_dd = find_native("UnityPlayer", "nativeSetDefaultDisplay");
            Native *n_gfx = find_native("UnityPlayer", "nativeRecreateGfxState"), *n_rs = find_native("UnityPlayer", "nativeResize");
            Native *n_fc = find_native("UnityPlayer", "nativeFocusChanged"), *n_re = find_native("UnityPlayer", "nativeResume");
            Native *n_rd = find_native("UnityPlayer", "nativeRender");
            struct timespec t0, t1; int it = 0, falses = 0; uint8_t ev[64]; pthread_t wd; double el;
            if (!n_gfx || !n_rs || !n_rd || !n_re) { LOG("native render tidak lengkap\n"); return 1; }
            if (g_query && n_aa) LOG("== nativeRequestedAA = %d\n", ((NatI0)n_aa->fn)(&g_env_head, player));
            if (g_query && n_32) LOG("== nativeRequested32bitDisplayBuffer = %d\n", ((NatI0)n_32->fn)(&g_env_head, player) & 0xff);
            LOG("== SDL/EGL init ...\n");
            if (gfx_init()) return 1;
            {
              /* SDL (build mali) bisa memasang handler sinyal crash sendiri; cek lalu pasang ulang punya kita */
              static const int sg[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT, 0 }; int k;
              maps_load();
              for (k = 0; sg[k]; k++) {
                struct sigaction cur; char b[300];
                if (sigaction(sg[k], NULL, &cur) == 0 && cur.sa_sigaction != crash_handler) {
                  annot(U32((void *)cur.sa_sigaction), b, sizeof b);
                  LOG("[SIG] sinyal %d: handler diganti pihak lain (%s), dipasang ulang\n", sg[k], b);
                }
              }
              install_crash();
            }
            if (n_or) ((NatVI)n_or->fn)(&g_env_head, player, g_orient);
            if (n_dd) ((NatVI)n_dd->fn)(&g_env_head, player, 0);
            LOG("== nativeRecreateGfxState ...\n");
            ((NatVP)n_gfx->fn)(&g_env_head, player, obj_new(cls_get("android/view/Surface")));
            LOG("== nativeResize(%d,%d,1,0) ...\n", g_screen_w, g_screen_h);
            ((NatV4)n_rs->fn)(&g_env_head, player, g_screen_w, g_screen_h, 1, 0);
            if (n_fc) ((NatVI)n_fc->fn)(&g_env_head, player, 1);
            LOG("== nativeResume ...\n");
            ((NatV0)n_re->fn)(&g_env_head, player);
            g_main_thread = pthread_self();
            pthread_create(&wd, NULL, wd_thread, NULL); pthread_detach(wd);
            clock_gettime(CLOCK_MONOTONIC, &t0);
            LOG("== loop nativeRender (maks %d detik / %d frame) ...\n", g_maxsec, g_maxframes);
            for (;;) {
              int r, quit = 0;
              while (sdl.PollEvent(ev)) {
                u32 type = *(u32 *)ev;
                if (type == 0x100) quit = 1;                              /* SDL_QUIT */
                if (type == 0x300 && *(u32 *)(ev + 16) == 41) quit = 1;   /* ESC */
              }
              clock_gettime(CLOCK_MONOTONIC, &t1);
              el = (double)(t1.tv_sec - t0.tv_sec) + (double)(t1.tv_nsec - t0.tv_nsec) / 1e9;
              if (quit || el >= g_maxsec || g_frames >= g_maxframes) break;
              r = ((NatI0)n_rd->fn)(&g_env_head, player) & 0xff;
              it++;
              if (it <= 5 || it % 120 == 0) LOG("[loop] iter=%d nativeRender=%d frames=%d t=%.1fs\n", it, r, g_frames, el);
              if (!r) { falses++; usleep(16000); }
            }
            LOG("== loop selesai: iter=%d frames=%d nativeRender-false=%d waktu=%.1fs\n", it, g_frames, falses, el);
            return 0;
          }

          /* ------------------------------------------------------------------ main */
          int main(int argc, char **argv) {
            const char *logpath = "m3_log.txt"; int i; Lib *lmain, *lmono, *lunity;
            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--stage") && i + 1 < argc) { const char *s = argv[++i]; g_stage = (s[0] >= '1' && s[0] <= '4') ? s[0] - '0' : 1; }
              else if (!strcmp(argv[i], "--libdir") && i + 1 < argc) snprintf(g_libdir, sizeof g_libdir, "%s", argv[++i]);
              else if (!strcmp(argv[i], "--apk") && i + 1 < argc) snprintf(g_apk, sizeof g_apk, "%s", argv[++i]);
              else if (!strcmp(argv[i], "--datadir") && i + 1 < argc) snprintf(g_datadir, sizeof g_datadir, "%s", argv[++i]);
              else if (!strcmp(argv[i], "--log") && i + 1 < argc) logpath = argv[++i];
              else if (!strcmp(argv[i], "--maxsec") && i + 1 < argc) g_maxsec = parse_i(argv[++i]);
              else if (!strcmp(argv[i], "--maxframes") && i + 1 < argc) g_maxframes = parse_i(argv[++i]);
              else if (!strcmp(argv[i], "--orient") && i + 1 < argc) g_orient = parse_i(argv[++i]);
              else if (!strcmp(argv[i], "--dump") && i + 1 < argc) parse_dump(argv[++i]);
              else if (!strcmp(argv[i], "--query")) g_query = 1;
              else if (!strcmp(argv[i], "--size") && i + 1 < argc) { const char *z = argv[++i]; g_screen_w = parse_i(z); while (*z && *z != 'x') z++; if (*z == 'x') g_screen_h = parse_i(z + 1); }
            }
            {
              char rp[PATH_MAX_M];
              if (g_apk[0] && realpath(g_apk, rp) && strlen(rp) < sizeof g_apk) snprintf(g_apk, sizeof g_apk, "%s", rp);
              if (g_datadir[0] && realpath(g_datadir, rp) && strlen(rp) < sizeof g_datadir) snprintf(g_datadir, sizeof g_datadir, "%s", rp);
            }
            if (!g_ndump) parse_dump("30,150,600");
            g_log = fopen(logpath, "w");
            LOG("== m3loader (Blown Away Milestone 3) stage=%d libdir=%s apk=%s datadir=%s\n", g_stage, g_libdir, g_apk[0] ? g_apk : "(tidak ada)", g_datadir);
            init_tables(); install_crash(); preload_host();
            g_run_init = g_stage >= 2;
            if (g_stage >= 2) jni_init();
            lmain = load_lib("libmain.so"); lmono = load_lib("libmono.so");
            if (!lmain || !lmono) { LOG("libmain/libmono gagal dimuat\n"); summary(); return 1; }
            if (g_stage == 1) { lunity = load_lib("libunity.so"); if (!lunity) LOG("libunity gagal dimuat\n"); summary(); fflush(NULL); _exit(0); }

            call_jni_onload(lmain);
            {
              Native *nl = find_native("NativeLoader", "load");
              if (nl) {
                int r;
                LOG("== NativeLoader.load(\"%s\") ...\n", g_libdir);
                r = ((int (*)(void *, void *, void *))nl->fn)(&g_env_head, cls_get("com/unity3d/player/NativeLoader"), str_new(g_libdir));
                LOG("== NativeLoader.load -> %d\n", r);
              } else LOG("NativeLoader.load tidak terdaftar oleh libmain\n");
            }
            lunity = find_lib("libunity.so");
            if (!lunity) { LOG("libunity belum dimuat oleh libmain, memuat manual\n"); lunity = load_lib("libunity.so"); }
            if (!lunity) { summary(); return 1; }
            if (!has_natives_of("UnityPlayer")) call_jni_onload(lunity);
            summary();
            if (g_stage >= 3) {
              Native *ij = find_native("UnityPlayer", "initJni"), *nf = find_native("UnityPlayer", "nativeFile");
              JObj *player = obj_new(cls_get("com/unity3d/player/UnityPlayer")), *ctx = obj_new(cls_get("android/content/ContextWrapper"));
              if (ij) { LOG("== UnityPlayer.initJni ...\n"); ((void (*)(void *, void *, void *))ij->fn)(&g_env_head, player, ctx); LOG("== initJni selesai\n"); }
              else LOG("initJni tidak terdaftar\n");
              if (nf) { LOG("== UnityPlayer.nativeFile(\"%s\") ...\n", g_apk); ((void (*)(void *, void *, void *))nf->fn)(&g_env_head, player, str_new(g_apk)); LOG("== nativeFile selesai\n"); }
              else LOG("nativeFile tidak terdaftar\n");
              summary();
              if (g_stage >= 4) {
                int rg = run_gfx(player);
                LOG("== run_gfx selesai (kode %d)\n", rg);
                summary();
              }
            }
            LOG("== selesai tanpa crash ==\n");
            fflush(NULL);
            _exit(0);
          }
          EOF_C
          cat > out/BlownAwayM4.sh <<'EOF_L'
          #!/bin/bash
          # Blown Away - Milestone 4: window SDL + EGL(SDL) + loop nativeRender. Hasil: blownaway/m4_log.txt, m4_stdout.txt, m4_frame_*.bmp
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          for c in /opt/system/Tools/PortMaster /opt/tools/PortMaster "$XDG_DATA_HOME/PortMaster" /roms/ports/PortMaster /mnt/mmc/MUOS/PortMaster; do
            [ -f "$c/control.txt" ] && { controlfolder="$c"; break; }
          done
          [ -n "$controlfolder" ] && source "$controlfolder/control.txt" 2>/dev/null

          HERE="$(cd "$(dirname "$0")" && pwd)"
          GAMEDIR="$HERE/blownaway"
          [ -d "$GAMEDIR" ] || GAMEDIR="/${directory:-roms}/ports/blownaway"
          cd "$GAMEDIR" || exit 1

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:/usr/lib/arm-linux-gnueabihf:$LD_LIBRARY_PATH"
          chmod +x ./m4loader
          mkdir -p files
          rm -f m4_frame_*.bmp
          OUT=m4_stdout.txt
          : > "$OUT"
          APK="$(ls ./*.apk 2>/dev/null | head -n1)"
          {
            echo "m4 launcher $(date)"
            echo "GAMEDIR=$GAMEDIR  APK=${APK:-TIDAK ADA}"
            echo "uname: $(uname -a)"
            for f in libmain.so libmono.so libunity.so; do
              [ -f "libs/$f" ] && echo "libs/$f OK ($(wc -c < "libs/$f") byte)" || echo "libs/$f TIDAK ADA"
            done
            echo "SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-(default)}"
          } >> "$OUT" 2>&1

          ARGS="--stage 4 --libdir libs --apk $APK --datadir files --log m4_log.txt --maxsec 90 --dump 30,150,600"
          if command -v timeout >/dev/null 2>&1; then
            timeout 170 ./m4loader $ARGS >> "$OUT" 2>&1
          else
            ./m4loader $ARGS >> "$OUT" 2>&1
          fi
          echo "exit code: $?" >> "$OUT"
          ls -l m4_frame_*.bmp >> "$OUT" 2>&1
          sync
          sleep 1
          type pm_finish >/dev/null 2>&1 && pm_finish
          exit 0
          EOF_L
          bash -n out/BlownAwayM4.sh
          chmod +x out/BlownAwayM4.sh

      - name: Kompilasi (armhf, glibc)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-unused-parameter -Wno-cast-function-type \
            -fno-strict-aliasing -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 \
            -o out/blownaway/m4loader src/m4loader.c -Wl,--no-as-needed -ldl -lpthread
          arm-linux-gnueabihf-strip out/blownaway/m4loader
          file out/blownaway/m4loader || true
          arm-linux-gnueabihf-readelf -h out/blownaway/m4loader | grep -E 'Class|Machine|Flags'

      - name: Cek versi glibc (device = 2.37)
        run: |
          arm-linux-gnueabihf-readelf -V out/blownaway/m4loader | grep -o 'GLIBC_[0-9.]*' | sort -uV | tee /tmp/glibc_vers.txt
          MAXV=$(tail -n1 /tmp/glibc_vers.txt | sed 's/GLIBC_//')
          echo "GLIBC tertinggi yang dibutuhkan: $MAXV"
          if [ "$(printf '%s\n' "$MAXV" 2.37 | sort -V | tail -n1)" != "2.37" ]; then
            echo "::error::butuh GLIBC $MAXV > 2.37 (device tidak akan bisa menjalankan)"; exit 1
          fi

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: blownaway-m4f-armhf
          path: out/
