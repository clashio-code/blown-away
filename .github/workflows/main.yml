name: Build Blown Away M4f (armhf)

# Milestone 4b (M4 + penelusuran akses file + penangkap crash m4loader): window SDL2 + EGL dibungkus ke SDL + loop nativeRender (dump frame ke BMP).
# Jalankan manual: tab Actions -> "Build Blown Away M4f (armhf)" -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-blownaway-m4f.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM hard-float
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Tulis source loader
        run: |
          mkdir -p src out/blownaway
          cat > src/m4loader.c <<'EOF_C'
          /* m4loader (dasar: m3loader, Milestone 3 + 4f) - port Blown Away (Unity 4.6.x Mono, armeabi-v7a, libs bionic) ke Linux armhf (glibc).
           * Isi: loader ELF ARM buatan sendiri (libmain/libmono/libunity tidak bisa di-dlopen glibc), shim bionic->glibc,
           *      fake JNIEnv/JavaVM yang mencatat semua permintaan, crash handler yang menunjuk lib+offset.
           * Pakai: m3loader --stage N --libdir DIR --apk FILE --datadir DIR --log FILE
           *   stage 1: muat 3 lib + relokasi + resolusi simbol (TIDAK menjalankan kode game). Laporan simbol yang tak ketemu.
           *   stage 2: stage 1 + jalankan konstruktor + JNI_OnLoad(libmain) + NativeLoader.load + JNI_OnLoad(libunity).
           *   stage 3: stage 2 + panggil UnityPlayer.initJni dan nativeFile.
           *   stage 4: stage 3 + window SDL2 + EGL dibungkus ke SDL + loop nativeRender (dump frame ke BMP). Belum ada audio/input.
           * Catatan build: JANGAN pakai strtol/sscanf/atoi/strlcpy langsung (header toolchain baru mengikat ke GLIBC_2.38, device 2.37). */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <stddef.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <errno.h>
          #include <signal.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <time.h>
          #include <wchar.h>
          #include <dirent.h>
          #include <netdb.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <ucontext.h>
          #include <sys/prctl.h>

          typedef uint32_t u32;
          static inline u32 U32(const void *p) { return (u32)(uintptr_t)p; }
          static inline void *PTR(u32 v) { return (void *)(uintptr_t)v; }

          #ifndef R_ARM_RELATIVE
          #define R_ARM_RELATIVE 23
          #endif
          #ifndef PT_ARM_EXIDX
          #define PT_ARM_EXIDX 0x70000001
          #endif

          /* ------------------------------------------------------------------ log */
          static FILE *g_log;
          static int g_stage = 1, g_run_init = 0;
          static char g_libdir[256] = "libs", g_apk[300] = "", g_datadir[300] = "files";
          static int g_query = 0;
          static int g_screen_w = 640, g_screen_h = 480, g_orient = 0, g_maxsec = 90, g_maxframes = 1000000;
          static volatile int g_frames;
          static int g_dump[16], g_ndump;
          static void *g_win, *g_ctx;

          static void LOG(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            fflush(stdout);
            if (g_log) { va_start(ap, fmt); vfprintf(g_log, fmt, ap); va_end(ap); fflush(g_log); }
          }

          /* ------------------------------------------------------------------ lib */
          #define MAXLIBS 8
          typedef struct Lib {
            char name[64];
            uint8_t *base; u32 span;
            Elf32_Phdr ph[32]; int nph;
            const Elf32_Sym *symtab; const char *strtab; u32 nsym;
            u32 init, init_array, init_arraysz;
            int symbolic;
            u32 exidx, exidx_n;
            u32 rw_start;
            u32 *htab; u32 hsize;
            u32 *rcache; uint8_t *rdone;
            int n_self, n_lib, n_shim, n_host, n_unres, n_bad;
          } Lib;
          static Lib *g_libs[MAXLIBS]; static int g_nlibs;
          static const char *g_loading[MAXLIBS]; static int g_nloading;

          static Lib *find_lib(const char *name) {
            int i;
            for (i = 0; i < g_nlibs; i++) if (!strcmp(g_libs[i]->name, name)) return g_libs[i];
            return NULL;
          }
          static const char *addr2lib(u32 a, u32 *off) {
            int i;
            for (i = 0; i < g_nlibs; i++) {
              u32 b = U32(g_libs[i]->base);
              if (a >= b && a < b + g_libs[i]->span) { *off = a - b; return g_libs[i]->name; }
            }
            *off = a; return "?";
          }

          /* ------------------------------------------------------------------ crash handler */
          static __thread u32 t_fn;
          static char g_maps[1 << 18]; static int g_maps_len;
          static void maps_load(void) {
            int fd = open("/proc/self/maps", O_RDONLY); g_maps_len = 0;
            if (fd < 0) { g_maps[0] = 0; return; }
            for (;;) {
              ssize_t n = read(fd, g_maps + g_maps_len, sizeof g_maps - 1 - (size_t)g_maps_len);
              if (n <= 0) break;
              g_maps_len += (int)n;
              if (g_maps_len >= (int)sizeof g_maps - 1) break;
            }
            close(fd); g_maps[g_maps_len] = 0;
          }
          static u32 hex8(const char **pp) {
            const char *p = *pp; u32 v = 0;
            for (;; p++) { char c = *p; int d; if (c >= '0' && c <= '9') d = c - '0'; else if (c >= 'a' && c <= 'f') d = c - 'a' + 10; else break; v = v * 16 + (u32)d; }
            *pp = p; return v;
          }
          static int maps_find(u32 a, char *perms, char *name, u32 *off) {
            const char *p = g_maps;
            while (*p) {
              const char *q = p, *ps; u32 st, en, fo; int k;
              st = hex8(&q); if (*q == '-') q++;
              en = hex8(&q); if (*q == ' ') q++;
              memcpy(perms, q, 4); perms[4] = 0; q += 4; if (*q == ' ') q++;
              fo = hex8(&q);
              for (k = 0; k < 2; k++) { while (*q == ' ') q++; while (*q && *q != ' ' && *q != '\n') q++; }
              while (*q == ' ') q++;
              ps = q; while (*q && *q != '\n') q++;
              if (a >= st && a < en) {
                size_t n = (size_t)(q - ps); if (n > 200) n = 200;
                memcpy(name, ps, n); name[n] = 0; *off = a - st + fo; return 1;
              }
              p = (*q == '\n') ? q + 1 : q;
            }
            return 0;
          }
          /* tulis anotasi alamat; return 1 bila alamat ada di wilayah executable */
          static int annot(u32 a, char *buf, size_t n) {
            u32 off; const char *l = addr2lib(a, &off); char perms[8], nm[256]; u32 fo;
            buf[0] = 0;
            if (l[0] != '?') { snprintf(buf, n, "%s+0x%x", l, off); return 1; }
            if (maps_find(a, perms, nm, &fo)) {
              const char *b = strrchr(nm, '/'); Dl_info di; const char *sym = ""; u32 so = 0;
              b = b ? b + 1 : nm;
              if (dladdr(PTR(a), &di) && di.dli_sname) { sym = di.dli_sname; so = a - U32(di.dli_saddr); }
              snprintf(buf, n, "%s %s+0x%x [%s] fileoff=0x%x", b, sym, so, perms, fo);
              return perms[2] == 'x';
            }
            return 0;
          }
          static void dump_regs(const char *tag, int sig, siginfo_t *si, void *ucv) {
            u32 pc = 0, lr = 0, sp = 0, i; int shown = 0; char b1[400];
            (void)ucv; (void)i; (void)shown; (void)b1;
            maps_load();
          #ifdef __arm__
            {
              ucontext_t *uc = (ucontext_t *)ucv; struct sigcontext *m = &uc->uc_mcontext;
              pc = m->arm_pc; lr = m->arm_lr; sp = m->arm_sp;
              LOG("  r0=%08lx r1=%08lx r2=%08lx r3=%08lx r4=%08lx r5=%08lx\n  r6=%08lx r7=%08lx r8=%08lx r9=%08lx r10=%08lx fp=%08lx ip=%08lx\n",
                  m->arm_r0, m->arm_r1, m->arm_r2, m->arm_r3, m->arm_r4, m->arm_r5, m->arm_r6, m->arm_r7, m->arm_r8, m->arm_r9, m->arm_r10, m->arm_fp, m->arm_ip);
            }
          #endif
            LOG("\n*** %s sinyal=%d fault_addr=%p tid=%d\n", tag, sig, si ? si->si_addr : NULL, (int)syscall(SYS_gettid));
            annot(pc, b1, sizeof b1); LOG("    pc=%08x  %s\n", pc, b1);
            annot(lr, b1, sizeof b1); LOG("    lr=%08x  %s\n", lr, b1);
            if (pc > 64 && maps_find(pc, b1, b1 + 16, &i)) {
              const uint8_t *cp = (const uint8_t *)PTR(pc - 24); char hx[120]; int k, n = 0;
              for (k = 0; k < 32; k++) n += snprintf(hx + n, sizeof hx - (size_t)n, "%02x%s", cp[k], (k % 2) ? " " : "");
              LOG("    byte kode pc-24..pc+8: %s\n", hx);
            }
            if (t_fn) { annot(t_fn, b1, sizeof b1); LOG("    fungsi awal thread ini: %s\n", b1); } else LOG("    (thread utama atau thread bukan buatan game)\n");
            LOG("    sp=%08x\n", sp);
            if (sp) {
              LOG("    tumpukan (kata yang menunjuk ke kode):\n");
              for (i = 0; i < 400 && shown < 40; i++) {
                u32 w = ((u32 *)PTR(sp))[i];
                if (annot(w, b1, sizeof b1)) { LOG("      [sp+%u] %08x  %s\n", i * 4, w, b1); shown++; }
              }
            }
          }
          static void crash_handler(int sig, siginfo_t *si, void *ucv) { dump_regs("CRASH", sig, si, ucv); _exit(128 + sig); }
          static void hang_handler(int sig, siginfo_t *si, void *ucv) { dump_regs("THREAD UTAMA DIAM (watchdog)", sig, si, ucv); }
          static void install_crash(void) {
            struct sigaction sa; stack_t ss; static const int sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT, SIGTRAP, 0 };
            int i;
            ss.ss_sp = malloc(65536); ss.ss_size = 65536; ss.ss_flags = 0;
            if (ss.ss_sp) sigaltstack(&ss, NULL);
            memset(&sa, 0, sizeof sa);
            sa.sa_sigaction = crash_handler; sa.sa_flags = SA_SIGINFO | SA_ONSTACK; sigemptyset(&sa.sa_mask);
            for (i = 0; sigs[i]; i++) sigaction(sigs[i], &sa, NULL);
            sa.sa_sigaction = hang_handler; sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESTART;
            sigaction(SIGURG, &sa, NULL);
          }

          /* ------------------------------------------------------------------ thunk: stub bernama untuk simbol yang tak ketemu */
          #define MAXTHUNK 1024
          static u32 *g_thunk_mem; static const char *g_thunk_name[MAXTHUNK]; static int g_thunk_calls[MAXTHUNK]; static int g_nthunk;

          __attribute__((used, noinline, visibility("hidden"))) int thunk_handler_c(int idx, u32 lr) {
            u32 off; const char *n = addr2lib(lr, &off);
            int c = ++g_thunk_calls[idx];
            if (c <= 5 || (c & (c - 1)) == 0) LOG("[STUB] %s dipanggil (#%d) dari %s+0x%x\n", g_thunk_name[idx], c, n, off);
            return 0;
          }
          #ifdef __arm__
          __attribute__((naked, noinline)) static void thunk_dispatch_asm(void) {
            __asm__ volatile("mov r0, r12\n\tmov r1, lr\n\tb thunk_handler_c\n");
          }
          #else
          static void thunk_dispatch_asm(void) {}
          #endif

          static void *thunk_for(const char *name) {
            int i; u32 *w;
            for (i = 0; i < g_nthunk; i++) if (!strcmp(g_thunk_name[i], name)) return &g_thunk_mem[i * 3];
            if (g_nthunk >= MAXTHUNK) { LOG("thunk penuh!\n"); return NULL; }
            if (!g_thunk_mem) {
              int fl = MAP_PRIVATE | MAP_ANONYMOUS;
          #if !defined(__arm__) && defined(MAP_32BIT)
              fl |= MAP_32BIT;
          #endif
              g_thunk_mem = mmap(NULL, MAXTHUNK * 12, PROT_READ | PROT_WRITE | PROT_EXEC, fl, -1, 0);
              if (g_thunk_mem == MAP_FAILED) { g_thunk_mem = NULL; LOG("mmap thunk gagal\n"); return NULL; }
            }
            i = g_nthunk++;
            g_thunk_name[i] = strdup(name);
            w = &g_thunk_mem[i * 3];
            w[0] = 0xE300C000u | ((((u32)i >> 12) & 0xF) << 16) | ((u32)i & 0xFFF); /* movw r12,#i */
            w[1] = 0xE51FF004u;                                                   /* ldr pc,[pc,#-4] */
            w[2] = U32((void *)thunk_dispatch_asm);
          #ifdef __GNUC__
            __builtin___clear_cache((char *)w, (char *)(w + 3));
          #endif
            return w;
          }

          /* ================================================================== SHIM bionic -> glibc ================ */
          #define PTRMIN 0x10000u
          #define PATH_MAX_M 4096

          static int shim_page_size = 4096;
          static u32 shim_guard = 0x5a3c9e71u;
          static uint8_t shim_sF[3 * 84 + 16] __attribute__((aligned(8)));
          static uint8_t shim_ctype[257];
          static int16_t shim_tolower[257], shim_toupper[257];
          static int shim_herrno;
          static char g_fake_window[64], g_fake_sensor[64];

          static void init_tables(void) {
            int c;
            for (c = 0; c < 256; c++) {
              int f = 0;
              if (c >= 'A' && c <= 'Z') f |= 0x01;
              if (c >= 'a' && c <= 'z') f |= 0x02;
              if (c >= '0' && c <= '9') f |= 0x04;
              if ((c >= 9 && c <= 13) || c == 32) f |= 0x08;
              if ((c >= 33 && c <= 47) || (c >= 58 && c <= 64) || (c >= 91 && c <= 96) || (c >= 123 && c <= 126)) f |= 0x10;
              if (c < 32 || c == 127) f |= 0x20;
              if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F') || (c >= 'a' && c <= 'f')) f |= 0x40;
              if (c == 32) f |= 0x80;
              shim_ctype[c + 1] = (uint8_t)f;
              shim_tolower[c + 1] = (int16_t)((c >= 'A' && c <= 'Z') ? c + 32 : c);
              shim_toupper[c + 1] = (int16_t)((c >= 'a' && c <= 'z') ? c - 32 : c);
            }
            shim_tolower[0] = shim_toupper[0] = -1;
          }

          static int *shim_errno_loc(void) { return &errno; }
          static int *shim_get_h_errno(void) { return &shim_herrno; }
          static int shim_gettid(void) { return (int)syscall(SYS_gettid); }
          static int msig(int s) { return s >= 32 ? s + 2 : s; } /* SIGRTMIN bionic=32, glibc=34 */
          static int shim_tkill(int tid, int sig) { LOG("[SYS] tkill(%d, %d)\n", tid, sig); return (int)syscall(SYS_tkill, tid, msig(sig)); }
          static void *shim_bsd_signal(int sig, void *h) { return (void *)signal(msig(sig), (void (*)(int))h); }

          static size_t shim_strlcpy(char *d, const char *s, size_t n) {
            size_t l = strlen(s);
            if (n) { size_t c = l >= n ? n - 1 : l; memcpy(d, s, c); d[c] = 0; }
            return l;
          }

          /* ---- stat / dirent: layout bionic arm == kernel stat64/dirent64 == glibc *64 ---- */
          static int g_stat_n;
          static int shim_stat(const char *p, void *b) { int r = stat64(p, (struct stat64 *)b); if (g_stat_n < 200) { g_stat_n++; LOG("[FS] stat(\"%s\") -> %d\n", p, r); } return r; }
          static int shim_lstat(const char *p, void *b) { int r = lstat64(p, (struct stat64 *)b); if (g_stat_n < 200) { g_stat_n++; LOG("[FS] lstat(\"%s\") -> %d\n", p, r); } return r; }
          static int shim_fstat(int fd, void *b) { return fstat64(fd, (struct stat64 *)b); }
          static void *shim_readdir(DIR *d) { return (void *)readdir64(d); }

          /* ---- sysconf: nomor konstanta bionic != glibc ---- */
          static long shim_sysconf(int n) {
            int m;
            switch (n) {
              case 0x27: case 0x28: m = _SC_PAGESIZE; break;
              case 0x60: m = _SC_NPROCESSORS_CONF; break;
              case 0x61: m = _SC_NPROCESSORS_ONLN; break;
              case 0x62: m = _SC_PHYS_PAGES; break;
              case 0x63: m = _SC_AVPHYS_PAGES; break;
              case 0x06: m = _SC_CLK_TCK; break;
              case 0x0b: m = _SC_OPEN_MAX; break;
              default: LOG("[SHIM] sysconf(0x%x) tidak dikenal -> -1\n", n); errno = EINVAL; return -1;
            }
            return sysconf(m);
          }

          /* ---- pthread: objek bionic cuma 4 byte; simpan pointer ke objek glibc di dalamnya ---- */
          static pthread_mutex_t *mget(void *gp) {
            volatile u32 *g = (volatile u32 *)gp;
            for (;;) {
              u32 v = *g, nv;
              pthread_mutex_t *m; pthread_mutexattr_t a; int t;
              if (v >= PTRMIN) return (pthread_mutex_t *)PTR(v);
              m = calloc(1, sizeof *m);
              t = ((v & 0xC000) == 0x4000) ? PTHREAD_MUTEX_RECURSIVE : ((v & 0xC000) == 0x8000) ? PTHREAD_MUTEX_ERRORCHECK : PTHREAD_MUTEX_NORMAL;
              pthread_mutexattr_init(&a); pthread_mutexattr_settype(&a, t); pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              nv = __sync_val_compare_and_swap(g, v, U32(m));
              if (nv == v) return m;
              pthread_mutex_destroy(m); free(m);
            }
          }
          static int shim_mutex_init(void *g, const void *attr) {
            int32_t t = attr ? *(const int32_t *)attr : 0;
            pthread_mutex_t *m = calloc(1, sizeof *m); pthread_mutexattr_t a;
            pthread_mutexattr_init(&a); pthread_mutexattr_settype(&a, t == 1 ? PTHREAD_MUTEX_RECURSIVE : t == 2 ? PTHREAD_MUTEX_ERRORCHECK : PTHREAD_MUTEX_NORMAL);
            pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
            *(u32 *)g = U32(m);
            return 0;
          }
          static int shim_mutex_destroy(void *g) {
            u32 v = *(u32 *)g;
            if (v >= PTRMIN) { pthread_mutex_destroy((pthread_mutex_t *)PTR(v)); free(PTR(v)); }
            *(u32 *)g = 0;
            return 0;
          }
          static int shim_mutex_lock(void *g) { return pthread_mutex_lock(mget(g)); }
          static int shim_mutex_trylock(void *g) { return pthread_mutex_trylock(mget(g)); }
          static int shim_mutex_unlock(void *g) { return pthread_mutex_unlock(mget(g)); }
          static int shim_mutexattr_init(void *a) { *(int32_t *)a = 0; return 0; }
          static int shim_mutexattr_settype(void *a, int t) { *(int32_t *)a = t; return 0; }
          static int shim_mutexattr_destroy(void *a) { (void)a; return 0; }

          static pthread_cond_t *cget(void *gp) {
            volatile u32 *g = (volatile u32 *)gp;
            for (;;) {
              u32 v = *g, nv; pthread_cond_t *c;
              if (v >= PTRMIN) return (pthread_cond_t *)PTR(v);
              c = calloc(1, sizeof *c); pthread_cond_init(c, NULL);
              nv = __sync_val_compare_and_swap(g, v, U32(c));
              if (nv == v) return c;
              pthread_cond_destroy(c); free(c);
            }
          }
          static int shim_cond_init(void *g, const void *attr) {
            pthread_cond_t *c = calloc(1, sizeof *c); (void)attr;
            pthread_cond_init(c, NULL); *(u32 *)g = U32(c); return 0;
          }
          static int shim_cond_destroy(void *g) {
            u32 v = *(u32 *)g;
            if (v >= PTRMIN) { pthread_cond_destroy((pthread_cond_t *)PTR(v)); free(PTR(v)); }
            *(u32 *)g = 0; return 0;
          }
          static int shim_cond_signal(void *g) { return pthread_cond_signal(cget(g)); }
          static int shim_cond_broadcast(void *g) { return pthread_cond_broadcast(cget(g)); }
          static int shim_cond_wait(void *g, void *m) { return pthread_cond_wait(cget(g), mget(m)); }
          static int shim_cond_timedwait(void *g, void *m, const struct timespec *t) { return pthread_cond_timedwait(cget(g), mget(m), t); }
          static int shim_cond_timedwait_mono(void *g, void *m, const struct timespec *t) {
            struct timespec nm, nr, ar; long long dn, tt;
            clock_gettime(CLOCK_MONOTONIC, &nm); clock_gettime(CLOCK_REALTIME, &nr);
            dn = ((long long)t->tv_sec - nm.tv_sec) * 1000000000LL + ((long long)t->tv_nsec - nm.tv_nsec);
            tt = (long long)nr.tv_sec * 1000000000LL + nr.tv_nsec + dn; if (tt < 0) tt = 0;
            ar.tv_sec = (time_t)(tt / 1000000000LL); ar.tv_nsec = (long)(tt % 1000000000LL);
            return pthread_cond_timedwait(cget(g), mget(m), &ar);
          }

          static pthread_attr_t *aget(void *g) { u32 v = *(u32 *)g; return v >= PTRMIN ? (pthread_attr_t *)PTR(v) : NULL; }
          static int shim_attr_init(void *g) {
            pthread_attr_t *a = calloc(1, sizeof *a); pthread_attr_init(a); *(u32 *)g = U32(a); return 0;
          }
          static pthread_attr_t *aget_or_init(void *g) { pthread_attr_t *a = aget(g); if (!a) { shim_attr_init(g); a = aget(g); } return a; }
          static int shim_attr_destroy(void *g) {
            pthread_attr_t *a = aget(g);
            if (a) { pthread_attr_destroy(a); free(a); }
            *(u32 *)g = 0; return 0;
          }
          static int shim_attr_setdetachstate(void *g, int s) { return pthread_attr_setdetachstate(aget_or_init(g), s); }
          static int shim_attr_getdetachstate(void *g, int *s) { return pthread_attr_getdetachstate(aget_or_init(g), s); }
          static int shim_attr_setstacksize(void *g, size_t s) { return pthread_attr_setstacksize(aget_or_init(g), s); }
          static int shim_attr_setschedparam(void *g, const struct sched_param *p) { return pthread_attr_setschedparam(aget_or_init(g), p); }
          static int shim_attr_setschedpolicy(void *g, int p) { return pthread_attr_setschedpolicy(aget_or_init(g), p); }
          static int shim_attr_getstack(void *g, void **a, size_t *s) { return pthread_attr_getstack(aget_or_init(g), a, s); }
          static int shim_getattr_np(pthread_t t, void *g) {
