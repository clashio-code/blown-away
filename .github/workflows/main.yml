          }
          typedef struct { void *(*fn)(void *); void *arg; } TStart;
          static void *thread_tramp(void *p) {
            TStart t = *(TStart *)p; stack_t ss; u32 o; const char *l;
            free(p);
            ss.ss_sp = malloc(65536); ss.ss_size = 65536; ss.ss_flags = 0;
            if (ss.ss_sp) sigaltstack(&ss, NULL);
            t_fn = U32((void *)t.fn);
            l = addr2lib(t_fn, &o);
            LOG("[THREAD] tid=%d mulai, fungsi=%s+0x%x\n", (int)syscall(SYS_gettid), l, o);
            return t.fn(t.arg);
          }
          static int shim_pthread_create(pthread_t *t, void *attr, void *(*fn)(void *), void *arg) {
            TStart *ts = malloc(sizeof *ts); u32 o; const char *l = addr2lib(U32((void *)fn), &o); pthread_attr_t *ha = attr ? aget(attr) : NULL; int r;
            size_t ss = 0;
