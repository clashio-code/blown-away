          /* ---- sinyal: sigset_t bionic 32-bit, struct sigaction beda ---- */
          typedef struct { u32 handler; u32 mask; int32_t flags; u32 restorer; } BSigaction;
          static void bmask2host(u32 m, sigset_t *h) {
            int b; sigemptyset(h);
            for (b = 0; b < 31; b++) if (m & (1u << b)) sigaddset(h, b + 1);
          }
          static u32 host2bmask(const sigset_t *h) {
            u32 m = 0; int s;
            for (s = 1; s <= 31; s++) if (sigismember(h, s) == 1) m |= 1u << (s - 1);
            return m;
          }
          static BSigaction g_gh[65]; static int g_gh_set[65], g_sig_events;
          static int is_crash_sig(int s) { return s == SIGSEGV || s == SIGBUS || s == SIGILL || s == SIGFPE; }
          static void chain_handler(int sig, siginfo_t *si, void *ucv) {
            BSigaction *h = &g_gh[sig];
            if (g_sig_events++ < 12) dump_regs("SINYAL diterima (diteruskan ke handler game)", sig, si, ucv);
            if (h->flags & 4) ((void (*)(int, siginfo_t *, void *))PTR(h->handler))(sig, si, ucv);
            else ((void (*)(int))PTR(h->handler))(sig);
          }
          static int shim_sigaction(int sig, const BSigaction *act, BSigaction *old) {
            struct sigaction a, o; int r;
            if (sig > 0 && sig < 65 && is_crash_sig(sig)) {
              if (!act && old && g_gh_set[sig]) { *old = g_gh[sig]; return 0; }
              if (act && act->handler >= 2) {
                u32 off; const char *ln = addr2lib(act->handler, &off);
                if (strcmp(ln, "libunity.so")) {
                  if (old) { if (g_gh_set[sig]) *old = g_gh[sig]; else memset(old, 0, sizeof *old); }
                  g_gh[sig] = *act; g_gh_set[sig] = 1;
                  LOG("[SHIM] sigaction(%d): handler game %s+0x%x dipasang lewat penangkap m4loader (log dulu, lalu teruskan)\n", sig, ln, off);
                  memset(&a, 0, sizeof a);
                  a.sa_sigaction = chain_handler; a.sa_flags = act->flags | SA_SIGINFO | SA_ONSTACK; bmask2host(act->mask, &a.sa_mask);
                  return sigaction(sig, &a, NULL);
                }
              }
            }
            memset(&a, 0, sizeof a); memset(&o, 0, sizeof o);
            if (act && (sig == SIGSEGV || sig == SIGBUS || sig == SIGILL || sig == SIGFPE || sig == SIGABRT || sig == SIGTRAP)) {
              u32 off; const char *ln = addr2lib(act->handler, &off);
              if (!strcmp(ln, "libunity.so")) { LOG("[SHIM] sigaction(%d): handler crash milik libunity (+0x%x) diabaikan, pakai penangkap m4loader\n", sig, off); if (old) memset(old, 0, sizeof *old); return 0; }
            }
            if (act) {
              a.sa_handler = (void (*)(int))PTR(act->handler);
              a.sa_flags = act->flags; bmask2host(act->mask, &a.sa_mask);
            }
            r = sigaction(msig(sig), act ? &a : NULL, old ? &o : NULL);
            if (old && r == 0) { old->handler = U32((void *)o.sa_handler); old->flags = o.sa_flags; old->mask = host2bmask(&o.sa_mask); old->restorer = 0; }
            return r;
          }
          static int shim_sigprocmask(int how, const u32 *set, u32 *old) {
            sigset_t s, o; int r;
            if (set) bmask2host(*set, &s);
            r = sigprocmask(how, set ? &s : NULL, old ? &o : NULL);
            if (old && r == 0) *old = host2bmask(&o);
            return r;
          }
          static int shim_pthread_sigmask(int how, const u32 *set, u32 *old) {
            sigset_t s, o; int r;
            if (set) bmask2host(*set, &s);
            r = pthread_sigmask(how, set ? &s : NULL, old ? &o : NULL);
            if (old && r == 0) *old = host2bmask(&o);
            return r;
          }
          static int shim_sigsuspend(const u32 *set) { sigset_t s; bmask2host(*set, &s); return sigsuspend(&s); }

          /* ---- setjmp/longjmp: jmp_buf bionic cuma 256 byte (glibc sigjmp_buf lebih besar) ---- */
          #ifdef __arm__
