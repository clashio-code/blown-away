          static const char *special_string(const char *name, JObj *thiz) {
            if (!strcmp(name, "getPackageName")) return "de.blackpants.blownaway";
            if (!strcmp(name, "getExternalStorageState") || !strcmp(name, "MEDIA_MOUNTED")) return "mounted";
            if (!strcmp(name, "getPackageCodePath") || !strcmp(name, "sourceDir") || !strcmp(name, "publicSourceDir")) return g_apk;
            if (!strcmp(name, "nativeLibraryDir")) return g_libdir;
            if (!strcmp(name, "dataDir")) return g_datadir;
            if ((!strcmp(name, "getAbsolutePath") || !strcmp(name, "getPath") || !strcmp(name, "toString")) && thiz && thiz->str) return thiz->str;
            if (!strcmp(name, "getString")) return "0123456789abcdef";
            if (!strcmp(name, "getLanguage")) return "en";
            if (!strcmp(name, "getCountry")) return "US";
            if (!strcmp(name, "getInstallerPackageName")) return "com.android.vending";
            return "";
          }
          static int is_file_getter(const char *n) {
            return !strcmp(n, "getFilesDir") || !strcmp(n, "getCacheDir") || !strcmp(n, "getExternalFilesDir") || !strcmp(n, "getExternalCacheDir") ||
                   !strcmp(n, "getObbDir") || !strcmp(n, "getDir") || !strcmp(n, "getDataDirectory") || !strcmp(n, "getExternalStorageDirectory");
          }
          static u32 call_core(JMeth *m, JObj *thiz, JObj *arg0) {
            const char *rs; int c;
            if (!m) return 0;
            c = ++m->ncalls;
