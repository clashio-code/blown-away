            LOG("[THREAD] pthread_create dipanggil: fungsi=%s+0x%x attr=%p stacksize=%u\n", l, o, (void *)ha, (unsigned)ss);
            r = pthread_create(t, ha, thread_tramp, ts);
            LOG("[THREAD] pthread_create -> %d\n", r);
            return r;
          }
