              void *h = dlopen(names[i], RTLD_NOW | RTLD_GLOBAL);
              LOG("  host %-16s : %s\n", names[i], h ? "OK" : "tidak ada");
              if (h && g_nhost < 8) g_host_h[g_nhost++] = h;
            }
            *(void **)&host_vfscanf = dlsym(RTLD_DEFAULT, "vfscanf");
          }
          static void *host_lookup(const char *name) {
            void *p = dlsym(RTLD_DEFAULT, name); int i;
            for (i = 0; !p && i < g_nhost; i++) p = dlsym(g_host_h[i], name);
